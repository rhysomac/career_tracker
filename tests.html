  test(`${label} Max selects the highest raw seasonal value, preserving its display and zeroes`, () => {
    const first = fixture("25/26", ["Cl #", "Name", label],
      [[1, "Player A", value], [2, "Zero", 0], [3, "Missing", null]]);
    const second = fixture("26/27", ["Cl #", "Name", label], [[1, "Player A", value / 2]]);
    first.rows[0][first.columns[2].key].text = text;
    const timeline = createSeasonStatTimeline({ Start: fixture("Start", ["Cl #", "Name", label], [[1, "Player A", 99]]),
      "25/26": first, "26/27": second }, ["25/26", "26/27", "27/28"], label, sheet);
    const maxColumn = timeline.columns.find(column => column.label === "Max");
    return timeline.rows[0].Max.value === value && timeline.rows[0].Max.text === text &&
      timeline.rows[1].Max.value === 0 && timeline.rows[2].Max.value === null &&
      Boolean(createCellFormatter(timeline)(maxColumn, value).backgroundColor);
  });
}
