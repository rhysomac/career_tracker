<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101d1c">
  <title>Squad Builder</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <div class="intro"><p id="season-label">Waiting for your club squad...</p><span id="save-state">Saved on This Device</span></div>
    <div id="error" role="alert" hidden></div>
    <div class="workspace">
      <section class="board panel" aria-labelledby="board-heading">
        <div class="panel-heading"><div><span class="eyebrow">FORMATION</span><h3 id="board-heading">4-2-3-1 <span>Wide</span></h3></div><label class="lineup-choice"><span class="sr-only">Select XI</span><select id="lineup-select"><option value="0">1st XI</option><option value="1">2nd XI</option><option value="2">3rd XI</option></select></label><button id="clear" class="subtle" type="button">Clear XI</button></div>
        <div class="stats"><div><strong id="xi-count">0 / 11</strong><span>STARTING XI</span></div><div><strong id="average">--</strong><span>AVERAGE OVR</span></div><div><strong id="average-age">--</strong><span>AVERAGE AGE</span></div></div>
        <div class="pitch" id="pitch" aria-label="4-2-3-1 wide formation">
          <div class="pitch-lines" aria-hidden="true"><div class="halfway"></div><div class="centre-circle"></div><div class="centre-spot"></div><div class="penalty top"></div><div class="penalty bottom"></div><div class="six-yard top"></div><div class="six-yard bottom"></div><div class="goal top"></div><div class="goal bottom"></div></div>
          <div id="slots"></div>
        </div>
        <span id="instruction" class="sr-only" role="status" aria-live="polite"></span>
      </section>
      <aside class="roster panel" aria-labelledby="roster-heading">
        <div class="panel-heading"><h3 id="roster-heading">Player Pool <span id="roster-count">0</span></h3><button id="add-player" class="primary" type="button">+ Add Player</button></div>
        <div class="filters"><label class="search-label"><span class="sr-only">Search Players by Name</span><input id="search" type="search" placeholder="Search Name..."></label><label><span class="sr-only">Filter by Position</span><select id="position-filter"><option value="">All Positions</option></select></label></div>
        <fieldset class="source-filter" id="source-filter"><legend>Player Source</legend><label><input type="checkbox" value="active" checked> Active Squad</label><label><input type="checkbox" value="loan" checked> On Loan</label><label><input type="checkbox" value="created" checked> Created Players</label></fieldset>
        <div class="pool-legend"><span>PLAYER</span><label class="pool-sort">Sort by<select id="pool-sort"><option value="ovr-desc">OVR: High to Low</option><option value="ovr-asc">OVR: Low to High</option><option value="pot-desc">Potential: High to Low</option><option value="age-asc">Age: Young to Old</option><option value="age-desc">Age: Old to Young</option><option value="name-asc">Name: A to Z</option><option value="position-asc">Position</option></select></label></div>
        <div id="player-list" class="player-list"></div>
        <div class="roster-footer"><span id="list-count">0 players</span><span>Click or drag to add to the XI</span></div>
      </aside>
    </div>
  </main>
  <dialog id="player-dialog">
    <form id="player-form">
      <div class="dialog-heading"><h2 id="player-dialog-title">Add Player</h2><button type="button" data-close="player-dialog" aria-label="Close Player Editor">X</button></div>
      <label>Player Name<input name="name" required maxlength="100" autocomplete="off"></label>
      <div class="form-grid"><label>Overall (OVR)<input name="ovr" type="number" min="1" max="99" required></label><label>Potential (POT)<input name="pot" type="number" min="1" max="99"></label><label>Age<input name="age" type="number" min="14" max="60"></label><label>Nation<select name="nation"></select></label></div>
      <fieldset><legend>Positions</legend><div class="form-grid" id="position-fields"></div></fieldset>
      <p id="player-error" class="form-error" role="alert"></p>
      <div class="dialog-actions"><button id="delete-player" class="danger" type="button" hidden>Delete Player</button><button type="button" data-close="player-dialog">Cancel</button><button class="primary" type="submit">Save Player</button></div>
    </form>
  </dialog>
</body>
</html>
